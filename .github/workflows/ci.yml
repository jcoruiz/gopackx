name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Oldest supported (go.mod), previous stable and current stable.
        go-version: ['1.22', 'oldstable', 'stable']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Coverage
        if: matrix.go-version == 'stable'
        run: go test $(go list ./... | grep -v examples) -coverprofile=coverage.out

      - name: Upload coverage
        if: matrix.go-version == 'stable'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out

      - name: Build examples
        run: |
          for dir in examples/*/; do
            echo "Building $dir..."
            go build "./$dir"
          done

  wasm:
    # Under GOOS=js there is one thread and no preemption: deadline timers
    # cannot fire while a solver computes, so this catches regressions in
    # deadline handling that native tests cannot see.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Test as WebAssembly (Node)
        run: |
          export PATH="$(go env GOROOT)/lib/wasm:$PATH"
          GOOS=js GOARCH=wasm go test -short -timeout 5m ./...
